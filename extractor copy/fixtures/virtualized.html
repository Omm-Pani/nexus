<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Virtualized collection fixture</title>
    <style>
      body { font: 16px system-ui; margin: 2rem; }
      #inventory-grid { position: relative; width: 44rem; height: 400px; overflow-y: auto; border: 1px solid #777; }
      #row-spacer { position: relative; height: 32000px; }
      #rendered-rows { position: absolute; left: 0; right: 0; top: 0; }
      [role="row"] { display: grid; grid-template-columns: 8rem 1fr 7rem 7rem; align-items: center; height: 40px; padding: 0 0.75rem; box-sizing: border-box; border-bottom: 1px solid #ddd; background: white; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Inventory</h1>
      <p>Selected row: <output id="selected-row" aria-live="polite">None</output></p>
      <div id="inventory-grid" role="grid" aria-label="Inventory rows" aria-rowcount="800">
        <div id="row-spacer">
          <div id="rendered-rows"></div>
        </div>
      </div>
    </main>
    <script>
      const viewport = document.querySelector('#inventory-grid');
      const renderedRows = document.querySelector('#rendered-rows');
      const rowHeight = 40;
      const renderedCount = 20;

      function renderRows() {
        const start = Math.min(780, Math.floor(viewport.scrollTop / rowHeight));
        renderedRows.style.top = `${start * rowHeight}px`;
        renderedRows.replaceChildren();
        for (let offset = 0; offset < renderedCount; offset += 1) {
          const rowNumber = start + offset + 1;
          const row = document.createElement('div');
          row.setAttribute('role', 'row');
          row.setAttribute('aria-rowindex', String(rowNumber));
          row.setAttribute('aria-label', `Open inventory row SKU-${String(rowNumber).padStart(3, '0')}`);
          row.setAttribute('tabindex', '0');
          row.dataset.action = 'open-row';
          row.dataset.rowNumber = String(rowNumber);
          Object.defineProperty(row, '__reactProps$fixture', {
            configurable: true,
            value: { onClick() {} },
          });
          row.innerHTML = `<strong>SKU-${String(rowNumber).padStart(3, '0')}</strong><span>Quantity ${rowNumber % 17}</span><button class="edit-row" type="button">Edit row ${rowNumber}</button><button class="delete-row" type="button">Delete row ${rowNumber}</button>`;
          renderedRows.append(row);
        }
      }

      viewport.addEventListener('scroll', renderRows, { passive: true });
      renderedRows.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (button) event.stopPropagation();
        else {
          const row = event.target.closest('[role="row"]');
          if (row) document.querySelector('#selected-row').textContent = `SKU-${String(row.dataset.rowNumber).padStart(3, '0')}`;
        }
      });
      renderRows();
    </script>
  </body>
</html>
