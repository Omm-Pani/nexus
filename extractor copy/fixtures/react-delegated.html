<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>React delegated fixture</title>
    <style>
      body { font: 16px system-ui; margin: 3rem; }
      [role="button"] { cursor: pointer; display: inline-block; margin-right: 0.5rem; padding: 0.7rem 1rem; border: 1px solid #777; border-radius: 0.25rem; }
    </style>
  </head>
  <body>
    <main id="react-root">
      <h1>Delegated counter</h1>
      <div id="increment" role="button" tabindex="0" data-action="increment">Increment count</div>
      <div id="reset" role="button" tabindex="0" data-action="reset">Reset count</div>
      <button id="nested-icon-control" type="button" aria-label="Download report">
        <span>
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M8 1v9m0 0 3-3m-3 3L5 7M2 13h12" fill="none" stroke="currentColor" />
          </svg>
        </span>
      </button>
      <p>Count: <strong id="delegated-count" role="status" aria-live="polite">0</strong></p>
    </main>
    <script>
      const root = document.querySelector('#react-root');
      const count = document.querySelector('#delegated-count');

      for (const target of root.querySelectorAll('[data-action]')) {
        Object.defineProperty(target, '__reactProps$fixture', {
          configurable: true,
          value: { onClick() {} },
        });
      }

      root.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action]');
        if (!target || !root.contains(target)) return;
        const current = Number(count.textContent);
        count.textContent = target.dataset.action === 'increment' ? String(current + 1) : '0';
      });

      root.addEventListener('keydown', (event) => {
        if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[data-action]')) {
          event.preventDefault();
          event.target.click();
        }
      });
    </script>
  </body>
</html>
