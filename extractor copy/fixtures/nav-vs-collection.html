<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Navigation versus collection fixture</title>
    <style>
      body { margin: 0; font: 16px system-ui; }
      .layout { display: grid; grid-template-columns: 12rem 1fr; gap: 2rem; padding: 2rem; }
      nav a { display: block; padding: 0.6rem; }
      #product-grid { display: grid; grid-template-columns: repeat(5, minmax(8rem, 1fr)); gap: 1rem; }
      .product-card { display: grid; align-content: start; min-height: 12rem; padding: 1rem; border: 1px solid #aaa; }
      .product-card h2 { min-height: 3rem; margin: 0; font-size: 1rem; }
      .price { margin-top: auto; }
    </style>
  </head>
  <body>
    <div class="layout">
      <nav aria-label="Site navigation">
        <a href="/home">Home</a>
        <a href="/products">Products</a>
        <a href="/orders">Orders</a>
        <a href="/settings">Settings</a>
        <a href="/help">Help</a>
      </nav>
      <main>
        <h1>Products</h1>
        <section id="product-grid" aria-label="Product grid">
          <article class="product-card"><h2>Atlas Backpack</h2><p class="price">$29.00</p><button>Add Atlas Backpack</button></article>
          <article class="product-card"><h2>Beacon Lamp</h2><p class="price">$41.00</p><button>Add Beacon Lamp</button></article>
          <article class="product-card"><h2>Comet Bottle</h2><p class="price">$18.00</p><button>Add Comet Bottle</button></article>
          <article class="product-card"><h2>Drift Jacket</h2><p class="price">$72.00</p><button>Add Drift Jacket</button></article>
          <article class="product-card"><h2>Ember Shoes</h2><p class="price">$64.00</p><button>Add Ember Shoes</button></article>
        </section>
      </main>
    </div>
  </body>
</html>
