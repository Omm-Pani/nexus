<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nested shadow roots fixture</title>
  </head>
  <body>
    <main>
      <h1>Shadow controls</h1>
      <section id="outer-host" aria-label="Account tools"></section>
    </main>
    <script>
      const outerHost = document.querySelector('#outer-host');
      const outerRoot = outerHost.attachShadow({ mode: 'open' });
      outerRoot.innerHTML = `
        <style>button, label { font: 16px system-ui; margin: 0.5rem; }</style>
        <button id="open-action" type="button">Open shadow action</button>
        <div id="inner-host"></div>
      `;

      const innerHost = outerRoot.querySelector('#inner-host');
      const closedRoot = innerHost.attachShadow({ mode: 'closed' });
      closedRoot.innerHTML = `
        <button id="closed-action" type="button">Closed shadow action</button>
        <label><input id="closed-toggle" type="checkbox" /> Closed shadow toggle</label>
      `;
    </script>
  </body>
</html>
