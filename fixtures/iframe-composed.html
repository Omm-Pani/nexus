<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Composed iframe fixture</title>
    <style>
      body { font: 16px system-ui; margin: 2rem; }
      iframe { display: block; width: 38rem; height: 12rem; margin: 1rem 0; border: 1px solid #999; }
    </style>
  </head>
  <body>
    <main>
      <h1>Frame composition</h1>
      <button id="main-action" type="button">Main frame action</button>
      <iframe id="same-origin" name="same-origin" title="Same-origin controls" src="frames/same-origin.html"></iframe>
      <iframe id="cross-origin" name="cross-origin" title="Cross-origin controls"></iframe>
    </main>
    <script>
      const crossOrigin = new URL('frames/cross-origin.html', window.location.href);
      crossOrigin.hostname = window.location.hostname === '127.0.0.1' ? 'localhost' : '127.0.0.1';
      document.querySelector('#cross-origin').src = crossOrigin.href;
    </script>
  </body>
</html>
