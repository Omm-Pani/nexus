<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Login timeline</title><style>
  body { font: 16px system-ui; padding: 24px; } label { display: block; margin: 16px 0; }
  input, button { padding: 8px; } #hover { margin-top: 24px; padding: 12px; border: 1px solid #ccc; width: 160px; }
</style></head>
<body>
  <main><form aria-label="Login" action="semantic-display.html" onsubmit="event.preventDefault(); location.href = this.action;">
    <label>Username <input name="username" autocomplete="off"></label>
    <label>Password <input name="password" type="password" autocomplete="off"></label>
    <button type="submit"><span>Login</span></button>
    <button type="button">No change</button>
  </form>
  <div id="hover" aria-label="Help" onpointerenter="document.querySelector('#tip').hidden=false" onpointerleave="document.querySelector('#tip').hidden=true">Hover for help</div>
  <p id="tip" hidden>Enter your test account</p>
  <p id="status" role="status">Ready</p></main>
</body></html>
