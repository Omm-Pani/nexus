<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Same-origin frame</title></head>

    <form>
      <label for="frame-name">Frame name</label>
      <input id="frame-name" name="frame-name" placeholder="Name in frame" />
